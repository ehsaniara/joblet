<!--
  Mermaid rendering for the GitHub Pages (Jekyll) site.

  GitHub's repository file view renders ```mermaid fenced blocks natively, but
  the published Jekyll site does not. Kramdown + Rouge emit a mermaid block as
  <div class="language-mermaid highlighter-rouge">…<code>…</code></div>; this
  script turns each of those into a <div class="mermaid"> and renders it.

  The `midnight` theme includes this file via {% raw %}{% include head-custom.html %}{% endraw %}.
-->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({startOnLoad: false, theme: 'dark', securityLevel: 'loose'});

    const renderMermaid = async () => {
        const blocks = document.querySelectorAll(
            'div.language-mermaid, pre > code.language-mermaid'
        );
        blocks.forEach((node) => {
            const wrapper = node.matches('div.language-mermaid') ? node : node.closest('pre');
            const code = node.matches('code') ? node : node.querySelector('code');
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = (code || node).textContent;
            wrapper.replaceWith(div);
        });
        if (blocks.length) {
            await mermaid.run();
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderMermaid);
    } else {
        renderMermaid();
    }
</script>
