name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

env:
  GO_VERSION: '1.24'

jobs:
  # Build all binaries
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Clean for package format
          CLEAN=$(echo "$VERSION" | sed 's/-[0-9]*-g[a-f0-9]*$//')
          echo "version=$CLEAN" >> $GITHUB_OUTPUT
          echo "Building version: $CLEAN"

      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Compile BPF objects
        # bpf2go -target amd64,arm64 produces both .o files from one invocation,
        # so this runs once per matrix arch but produces identical bytes.
        run: go generate ./internal/joblet/ebpf/telematics

      - name: Build all binaries
        run: |
          # Inject version info into pkg/version (same variables the Makefile sets)
          VPKG="github.com/ehsaniara/joblet/pkg/version"
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X ${VPKG}.Version=${{ steps.version.outputs.version }} -X ${VPKG}.GitCommit=${GITHUB_SHA} -X ${VPKG}.GitTag=${{ steps.version.outputs.version }} -X ${VPKG}.BuildDate=${BUILD_DATE}"

          # Main binaries
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags "$LDFLAGS -X ${VPKG}.Component=joblet" -o joblet-${{ matrix.arch }} ./cmd/joblet

          # Submodule binaries
          cd persist && GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags "$LDFLAGS -X ${VPKG}.Component=persist" -o ../persist-${{ matrix.arch }} ./cmd/persist && cd ..
          cd state && GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags "$LDFLAGS -X ${VPKG}.Component=state" -o ../state-${{ matrix.arch }} ./cmd/state && cd ..

          ls -la *-${{ matrix.arch }}

      - name: Verify built binary architecture
        run: |
          EXPECTED_ARCH="${{ matrix.arch }}"
          if [ "$EXPECTED_ARCH" = "arm64" ]; then
            EXPECTED_PATTERN="aarch64|ARM aarch64"
          else
            EXPECTED_PATTERN="x86-64|x86_64"
          fi

          echo "Verifying built binaries are $EXPECTED_ARCH..."
          for bin in joblet persist state; do
            ACTUAL=$(file "${bin}-${{ matrix.arch }}")
            if ! echo "$ACTUAL" | grep -qE "$EXPECTED_PATTERN"; then
              echo "ERROR: ${bin}-${{ matrix.arch }} has wrong architecture!"
              echo "  Expected: $EXPECTED_ARCH"
              echo "  Actual: $ACTUAL"
              exit 1
            fi
            echo "OK: ${bin}-${{ matrix.arch }} is $EXPECTED_ARCH"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: joblet-binary-${{ matrix.arch }}
          path: joblet-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: persist-binary-${{ matrix.arch }}
          path: persist-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: state-binary-${{ matrix.arch }}
          path: state-${{ matrix.arch }}

  # Build Debian packages
  build-deb:
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: joblet-binary-${{ matrix.arch }}
          path: ./

      - uses: actions/download-artifact@v4
        with:
          name: persist-binary-${{ matrix.arch }}
          path: ./

      - uses: actions/download-artifact@v4
        with:
          name: state-binary-${{ matrix.arch }}
          path: ./

      - name: Prepare binaries
        run: |
          echo "Files after download:"
          ls -la
          # Remove repo directories that conflict with binary names
          rm -rf persist state
          mv joblet-${{ matrix.arch }} joblet
          mv persist-${{ matrix.arch }} persist
          mv state-${{ matrix.arch }} state
          chmod +x joblet persist state
          echo "Files after rename:"
          ls -la joblet persist state
          file joblet persist state

      - name: Verify binary architecture
        run: |
          EXPECTED_ARCH="${{ matrix.arch }}"
          if [ "$EXPECTED_ARCH" = "arm64" ]; then
            EXPECTED_PATTERN="aarch64|ARM aarch64"
          else
            EXPECTED_PATTERN="x86-64|x86_64"
          fi

          echo "Verifying binaries are $EXPECTED_ARCH..."
          FAILED=0
          for bin in joblet persist state; do
            ACTUAL=$(file "$bin")
            if ! echo "$ACTUAL" | grep -qE "$EXPECTED_PATTERN"; then
              echo "ERROR: $bin has wrong architecture!"
              echo "  Expected: $EXPECTED_ARCH ($EXPECTED_PATTERN)"
              echo "  Actual: $ACTUAL"
              FAILED=1
            else
              echo "OK: $bin is $EXPECTED_ARCH"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "Architecture verification failed!"
            exit 1
          fi
          echo "All binaries verified as $EXPECTED_ARCH"

      - name: Build Debian package
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking binaries exist:"
          ls -la joblet persist state
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh ${{ matrix.arch }} ${{ needs.build-binaries.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"

  # Build RPM packages
  build-rpm:
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: joblet-binary-${{ matrix.arch }}
          path: ./

      - uses: actions/download-artifact@v4
        with:
          name: persist-binary-${{ matrix.arch }}
          path: ./

      - uses: actions/download-artifact@v4
        with:
          name: state-binary-${{ matrix.arch }}
          path: ./

      - name: Prepare binaries
        run: |
          echo "Files after download:"
          ls -la
          # Remove repo directories that conflict with binary names
          rm -rf persist state
          mv joblet-${{ matrix.arch }} joblet
          mv persist-${{ matrix.arch }} persist
          mv state-${{ matrix.arch }} state
          chmod +x joblet persist state
          echo "Files after rename:"
          ls -la joblet persist state
          file joblet persist state

      - name: Verify binary architecture
        run: |
          EXPECTED_ARCH="${{ matrix.arch }}"
          if [ "$EXPECTED_ARCH" = "arm64" ]; then
            EXPECTED_PATTERN="aarch64|ARM aarch64"
          else
            EXPECTED_PATTERN="x86-64|x86_64"
          fi

          echo "Verifying binaries are $EXPECTED_ARCH..."
          FAILED=0
          for bin in joblet persist state; do
            ACTUAL=$(file "$bin")
            if ! echo "$ACTUAL" | grep -qE "$EXPECTED_PATTERN"; then
              echo "ERROR: $bin has wrong architecture!"
              echo "  Expected: $EXPECTED_ARCH ($EXPECTED_PATTERN)"
              echo "  Actual: $ACTUAL"
              FAILED=1
            else
              echo "OK: $bin is $EXPECTED_ARCH"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "Architecture verification failed!"
            exit 1
          fi
          echo "All binaries verified as $EXPECTED_ARCH"

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build RPM package
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking binaries exist:"
          ls -la joblet persist state
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh ${{ matrix.rpm_arch }} ${{ needs.build-binaries.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"

  # Test packages
  test-packages:
    needs: [ build-deb, build-rpm ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages/

      - name: Test Debian packages
        run: |
          for deb in packages/deb-*/*.deb; do
            echo "Testing $deb..."
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Test RPM packages
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          for rpm in packages/rpm-*/*.rpm; do
            echo "Testing $rpm..."
            rpm -qip "$rpm"
            rpm -qlp "$rpm"
          done

  # Security scan
  security-scan:
    needs: [ build-deb, build-rpm ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages/

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './packages'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities, just report

  # Create GitHub Release
  release:
    needs: [ build-deb, build-rpm, build-binaries, test-packages, security-scan ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts/ -name "*.deb" -exec cp {} release/ \;
          find artifacts/ -name "*.rpm" -exec cp {} release/ \;

          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Server Installation (Linux)

            ### Debian/Ubuntu
            ```bash
            # AMD64 (Intel/AMD)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/joblet_${{ needs.build-binaries.outputs.version }}_amd64.deb
            sudo dpkg -i joblet_${{ needs.build-binaries.outputs.version }}_amd64.deb

            # ARM64 (AWS Graviton, ARM servers)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/joblet_${{ needs.build-binaries.outputs.version }}_arm64.deb
            sudo dpkg -i joblet_${{ needs.build-binaries.outputs.version }}_arm64.deb

            # Start service
            sudo systemctl start joblet && sudo systemctl enable joblet
            ```

            ### RHEL/CentOS/Amazon Linux
            ```bash
            # x86_64
            sudo yum install -y https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/joblet-${{ needs.build-binaries.outputs.version }}-1.x86_64.rpm

            # aarch64 (AWS Graviton)
            sudo yum install -y https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/joblet-${{ needs.build-binaries.outputs.version }}-1.aarch64.rpm

            # Start service
            sudo systemctl start joblet && sudo systemctl enable joblet
            ```

            ---

            ## RNX CLI (Client)

            The `rnx` CLI lives in its own repository and is released separately.
            The .deb/.rpm installer installs the latest rnx on the server host;
            for other machines download the binary for your platform from
            [joblet-rnx releases](https://github.com/ehsaniara/joblet-rnx/releases/latest).
            Any rnx release works with any Joblet release that speaks the same
            joblet-proto contract (see the joblet-rnx compatibility table).

            ---

            ## Quick Start

            ```bash
            # 1. Copy client config from server
            scp your-server:/opt/joblet/config/rnx-config.yml ~/.rnx/

            # 2. Test connection
            rnx job list

            # 3. Run a job
            rnx job run echo "Hello from Joblet!"
            ```

            ---

            ## Verify Checksums
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
